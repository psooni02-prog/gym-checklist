<style>

*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",Arial,sans-serif;letter-spacing:-.2px}
header{background:linear-gradient(135deg,#111214,#292c31);color:#fff;padding:28px max(18px,calc((100% - 940px)/2));border-bottom:1px solid #383b40}h1{font-size:25px;letter-spacing:-.8px;margin:0 0 7px;font-weight:750}header p{margin:0;color:#c3c6cc;font-size:14px}
main{max-width:940px;margin:auto;padding:18px;display:grid;gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:19px;box-shadow:0 3px 12px #17191d05}h2{font-size:17px;letter-spacing:-.4px;margin:0 0 15px;font-weight:750}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label.field{font-size:12px;color:#656a73;display:grid;gap:7px;font-weight:650}input,select,textarea{font:inherit;padding:11px 12px;border:1px solid #d9dce1;border-radius:9px;width:100%;background:#fff;color:var(--ink);outline:none}input:focus,select:focus{border-color:#555b65;box-shadow:0 0 0 3px #24272d12}
.progressText{font-size:13px;text-align:right;color:#4e535c;margin-top:16px;font-weight:700}.progress{height:9px;background:var(--track);border-radius:20px;overflow:hidden;margin-top:8px}.progress div{height:100%;width:0;background:linear-gradient(90deg,#24272d,#62666f);border-radius:20px;transition:width .2s}.completion{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px;padding:11px 13px;background:#f5f6f7;border:1px solid #e6e7ea;border-radius:10px;font-size:13px;color:#555a63}.completion strong{font-size:15px;color:#17191d}.completion.done{background:#eceef0;border-color:#cfd2d7}.completion .percent{font-size:22px;font-weight:800;letter-spacing:-.8px;color:#17191d}
.section{border:1px solid var(--line);border-radius:11px;margin:10px 0;overflow:hidden;background:#fff}.section.is-hidden{display:none !important}.section summary{font-weight:750;font-size:14px;padding:14px;cursor:pointer;background:#f7f8f9;list-style-position:inside}.items{padding:0 14px}.item{display:flex;gap:11px;align-items:flex-start;padding:13px 0;border-top:1px solid #eef0f2;font-size:14px;line-height:1.5;cursor:pointer}.item input{width:19px;height:19px;flex:none;margin:1px 0 0;accent-color:#25282e;cursor:pointer}.item small{display:block;color:#777c85;margin-top:4px;font-size:12px}.item.done span{text-decoration:line-through;color:#8b9098}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid #dfe1e5;border-radius:9px;padding:10px 13px;font-weight:700;font-size:13px;cursor:pointer;background:#f1f2f4;color:#24272d;transition:background .15s}.btn:hover{background:#e4e6e9}.btn.primary{background:#202329;color:#fff;border-color:#202329}.btn.primary:hover{background:#373a41}.status{font-size:13px;color:#666b74;margin-top:10px;line-height:1.5}.record{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;justify-content:space-between;gap:10px;margin:8px 0;align-items:center}.record small{display:block;color:#777c85;margin-top:5px}.shift-pill{display:inline-block;margin-top:14px;padding:5px 9px;background:#383b41;color:#fff;border-radius:6px;font-size:11px;font-weight:750;letter-spacing:.5px}
@media(max-width:580px){.fields{grid-template-columns:1fr}main{padding:10px}.card{padding:15px}.record{align-items:flex-start}header{padding-top:23px;padding-bottom:23px}h1{font-size:22px}}

<header>
  <h1>헬스장 직원 체크리스트</h1>
  <p>오픈 · 미들 · 마감 업무를 체크하고 날짜별로 저장하세요.</p>
</header>
<main>
  <section class="card">
    <h2>근무 정보</h2>
    <div class="fields">
      <label class="field">직원명<input id="employee" placeholder="예: 홍길동"></label>
      <label class="field">근무 날짜<input id="date" type="date"></label>
      <label class="field">근무 구분
        <select id="shift">
          <option value="오픈">오픈</option>
          <option value="미들">미들</option>
          <option value="마감">마감</option>
        </select>
      </label>
      <label class="field">특이사항 / 미완료 사유<input id="notes" placeholder="없으면 비워두세요"></label>
    </div>
    <div class="shift-pill" id="shiftPill">오픈 근무</div>
    <div class="progressText" id="progressText">0 / 0 (0%)</div>
    <div class="progress"><div id="progressBar"></div></div>
    <div class="completion" id="completion">
      <span id="completionText">체크리스트를 완료해 주세요.</span>
      <strong class="percent" id="completionPercent">0%</strong>
    </div>
  </section>

  <section class="card">
    <h2>체크리스트</h2>
    <div id="checklist"></div>
    <div class="buttons">
      <button class="btn primary" id="save">저장하기</button>
      <button class="btn" id="load">기록 불러오기</button>
      <button class="btn" id="csv">CSV 내보내기</button>
      <button class="btn" id="reset">체크 초기화</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section class="card">
    <h2>저장된 기록</h2>
    <div class="fields">
      <label class="field">직원명으로 검색<input id="searchName" placeholder="직원명 입력"></label>
      <label class="field">날짜로 검색<input id="searchDate" type="date"></label>
    </div>
    <div class="buttons">
      <button class="btn" id="search">기록 검색</button>
      <button class="btn" id="all">전체 보기</button>
    </div>
    <div id="records" class="status">저장된 기록은 클라우드에서 검색할 수 있습니다.</div>
  </section>
</main>

const $=id=>document.getElementById(id);
function localToday(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
$("date").value=localToday();

function render(){
 const root=$("checklist");
 root.innerHTML="";
 
 const currentShift = $("shift").value;
 const shiftSections = checklistData[currentShift] || [];

 shiftSections.forEach((sec, si)=>{
  const d=document.createElement("details");
  d.className="section";
  d.open=true;
  
  const sum=document.createElement("summary");
  sum.textContent=sec[0]+" · 0/"+sec[1].length;
  d.appendChild(sum);
  
  const items=document.createElement("div");
  items.className="items";
  
  sec[1].forEach((item, ii)=>{
   const lab=document.createElement("label");
   lab.className="item";
   const cb=document.createElement("input");
   cb.type="checkbox";
   cb.dataset.id=si+"-"+ii;
   const span=document.createElement("span");
   span.textContent=item[0];
   
   cb.addEventListener("change",()=>{
     lab.classList.toggle("done",cb.checked);
     progress();
   });
   
   lab.append(cb,span);
   items.appendChild(lab);
  });
  
  d.appendChild(items);
  root.appendChild(d);
 });
 
 $("shiftPill").textContent=currentShift+" 근무";
 progress();
}

function progress(){
 const visible=[...document.querySelectorAll('#checklist input[type=checkbox]')];
 const done=visible.filter(x=>x.checked).length;
 const total=visible.length;
 const pct=total?Math.round(done/total*100):0;

 $("progressText").textContent=`현재 ${$("shift").value} 근무 · ${done} / ${total}개 완료 (${pct}%)`;
 $("progressBar").style.width=pct+"%";
 $("completionPercent").textContent=pct+"% - ";
 
 const complete=total>0&&done===total;
 $("completion").classList.toggle("done",complete);
 $("completionText").textContent=complete?"모든 체크리스트를 완료했습니다. 저장하기를 눌러 기록을 남겨주세요.":"현재 근무의 체크리스트 완료율";
 
 [...document.querySelectorAll("#checklist .section")].forEach((d,i)=>{
  const boxes=[...d.querySelectorAll("input")];
  const shiftSections = checklistData[$("shift").value] || [];
  if(shiftSections[i]){
   d.querySelector("summary").textContent=shiftSections[i][0]+` · ${boxes.filter(x=>x.checked).length}/${boxes.length}`;
  }
 });
}

function current(){
 const checks={};
 document.querySelectorAll('#checklist input').forEach(c=>checks[c.dataset.id]=c.checked);
 return {employee:$("employee").value.trim(),work_date:$("date").value,shift:$("shift").value,notes:$("notes").value,checks,updated_at:new Date().toISOString()};
}

function setStatus(s){$("status").textContent=s}

async function save(){
 if(!supabase){setStatus("Supabase 설정(URL, KEY)을 코드 상단에 입력해주세요.");return}
 const r=current();
 if(!r.employee||!r.work_date){setStatus("직원명과 근무 날짜를 입력해주세요.");return}
 setStatus("클라우드에 저장 중...");
 const { error } = await supabase.from('gym_checklist_records').insert([r]);
 if(error){
  console.error(error);
  setStatus("저장 실패: " + error.message);
 } else {
  setStatus("클라우드 DB 저장 완료!");
  searchRecords();
 }
}

async function load(){
 if(!supabase){setStatus("Supabase 설정이 필요합니다.");return}
 const emp = $("employee").value.trim();
 const date = $("date").value;
 const shift = $("shift").value;
 if(!emp || !date){setStatus("직원명과 날짜를 입력해주세요.");return}
 
 const { data, error } = await supabase.from('gym_checklist_records')
   .select('*')
   .eq('employee', emp)
   .eq('work_date', date)
   .eq('shift', shift)
   .order('id', { ascending: false })
   .limit(1);
   
 if(error || !data || data.length === 0){
  setStatus("해당 기록이 없거나 불러오지 못했습니다.");
  return;
 }
 const r = data[0];
 $("employee").value=r.employee;
 $("date").value=r.work_date;
 $("shift").value=r.shift;
 $("notes").value=r.notes||"";
 render();
 document.querySelectorAll('#checklist input').forEach(c=>{
  if(r.checks && r.checks[c.dataset.id]){
   c.checked=true;
   c.closest(".item").classList.add("done");
  }
 });
 progress();
 setStatus("기록을 불러왔습니다.");
}

async function searchRecords(){
 if(!supabase) return;
 const name=$("searchName").value.trim();
 const date=$("searchDate").value;
 
 let query = supabase.from('gym_checklist_records').select('*').order('work_date', { ascending: false });
 if(name) query = query.ilike('employee', `%${name}%`);
 if(date) query = query.eq('work_date', date);
 
 const { data: rs, error } = await query;
 const root=$("records");
 root.innerHTML="";
 
 if(error || !rs || !rs.length){
  root.textContent="검색 결과가 없습니다.";
  return;
 }
 rs.forEach(r=>{
  const row=document.createElement("div");row.className="record";
  const done=r.checks?Object.values(r.checks).filter(Boolean).length:0, total=r.checks?Object.keys(r.checks).length:0;
  const info=document.createElement("div");
  info.innerHTML="<strong>"+esc(r.work_date)+" · "+esc(r.employee)+" · "+esc(r.shift)+"</strong><small>"+done+"/"+total+"개 완료 · "+esc(r.notes||"특이사항 없음")+"</small>";
  const b=document.createElement("button");b.className="btn";b.textContent="불러오기";
  b.onclick=()=>{
   $("employee").value=r.employee;
   $("date").value=r.work_date;
   $("shift").value=r.shift;
   $("notes").value=r.notes||"";
   render();
   document.querySelectorAll('#checklist input').forEach(c=>{
    if(r.checks && r.checks[c.dataset.id]){
     c.checked=true;
     c.closest(".item").classList.add("done");
    }
   });
   progress();
   setStatus("기록을 불러왔습니다.");
  };
  row.append(info,b);root.appendChild(row);
 });
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function exportCSV(){
 if(!supabase){setStatus("Supabase 설정이 필요합니다.");return}
 const { data: rs, error } = await supabase.from('gym_checklist_records').select('*');
 if(error || !rs || !rs.length){setStatus("내보낼 기록이 없습니다.");return}
 
 const rows=[["날짜","직원명","근무구분","특이사항","완료항목수"]];
 rs.forEach(r=>{
  const done=r.checks?Object.values(r.checks).filter(Boolean).length:0;
  rows.push([r.work_date,r.employee,r.shift,r.notes,done+"개"]);
 });
 
 const csv="\uFEFF"+rows.map(row=>row.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
 a.download="헬스장_체크리스트.csv";a.click();URL.revokeObjectURL(a.href);
}

$("save").onclick=save;
$("load").onclick=load;
$("csv").onclick=exportCSV;
$("reset").onclick=()=>{
  if(confirm("현재 체크만 초기화할까요?")){
    document.querySelectorAll('#checklist input').forEach(c=>{
      c.checked=false;
      c.closest(".item").classList.remove("done");
    });
    progress();
    setStatus("체크를 초기화했습니다.");
  }
};
$("search").onclick=searchRecords;
$("all").onclick=()=>{$("searchName").value="";$("searchDate").value="";searchRecords()};
$("shift").onchange=render;

// 초기 렌더링 실행
render();
</script>
